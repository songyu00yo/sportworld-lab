name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Initialize public examples
        run: python -B scripts/bootstrap.py --offline
      - name: Prepare checksum-verified public reference
        run: python -B emulator_route.py --prepare-reference
      - name: Python offline regressions
        run: python -B -m unittest discover -s . -p 'test_*.py'
      - name: Frontend offline regressions
        run: node --test test_progress.mjs test_workflow.mjs
      - name: Check shell entry points
        run: |
          for script in scripts/*.sh; do /bin/sh -n "$script"; done
          for script in *.command; do /bin/zsh -n "$script"; done
